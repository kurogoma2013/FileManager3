plugins { id 'com.android.application' }

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProperties[it] }

android { namespace 'jp.filemanager3.android'; compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'jp.filemanager3.android'; minSdk 26; targetSdk 36; versionCode 2026091801; versionName '0.0.2026091801' }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
}
dependencies { implementation 'androidx.core:core:1.15.0' }

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!releaseSigningReady) throw new GradleException('android/keystore.properties にrelease署名設定がありません。')
    }
}

tasks.register('copyDebugApk', Copy) {
    dependsOn('assembleDebug')
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(rootProject.projectDir.parentFile.toPath().resolve('dist'))
    rename { 'filemanager3-android-debug.apk' }
}

tasks.register('copyReleaseApk', Copy) {
    dependsOn('assembleRelease')
    from(layout.buildDirectory.file('outputs/apk/release/app-release.apk'))
    into(rootProject.projectDir.parentFile.toPath().resolve('dist/android-release'))
    rename { 'filemanager3-android-release.apk' }
    doLast {
        def apk = rootProject.projectDir.parentFile.toPath().resolve('dist/android-release/filemanager3-android-release.apk').toFile()
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).collect { String.format('%02x', it & 0xff) }.join()
        def manifest = "{\"version_code\":${android.defaultConfig.versionCode},\"version_name\":\"${android.defaultConfig.versionName}\",\"download_url\":\"/android/filemanager3-android-release.apk\",\"sha256\":\"${digest}\",\"size_bytes\":${apk.length()},\"release_notes\":\"FileManager3 Android版の最新版\"}\n"
        new File(apk.parentFile, 'latest.json').text = manifest
    }
}
