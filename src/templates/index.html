@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');

/* ui-consistency */:root{--ui-radius:8px;--ui-control-height:38px}body{-webkit-font-smoothing:antialiased}.card,.panel,.form-panel{border-radius:var(--ui-radius);box-shadow:0 8px 24px rgba(18,35,61,.08)}.topbar{background:#fff;backdrop-filter:none}.btn,button{min-height:var(--ui-control-height);border-radius:var(--ui-radius);box-shadow:none;transform:none;transition:background-color .15s ease,border-color .15s ease,color .15s ease}.btn:hover,button:hover{transform:none;box-shadow:none}.btn-sm{min-height:32px;border-radius:6px}input,select,textarea{border-radius:var(--ui-radius)}.table th,.table td{padding:12px 14px}.dialog-backdrop,.modal-backdrop{background:rgba(18,35,61,.36)}@media(max-width:560px){input,select,textarea{font-size:16px;min-height:44px}.btn,.btn-sm,button{min-height:44px}.content{padding:24px 16px}}</style></head><body><div class="app"><div class="sidebar-overlay"></div><aside class="sidebar"><div class="brand"><div class="brand-mark">⌂</div><span>FileManager<span style="color:#73a5ff">3</span><small style="display:block;font-size:10px;color:#8294b1;margin-top:3px;font-weight:500">v20260915.00</small></span></div><a class="nav-item active" href="/"><span>⌕</span><span>案件検索</span></a><a class="nav-item admin-nav-link" href="/admin"><span>⚙</span><span>管理メニュー</span></a><div class="nav-submenu admin-nav-link" style="margin-left:18px;border-left:1px solid #36506f;padding-left:8px"><a class="nav-item" href="/admin/projects"><span>▤</span><span>案件管理</span></a><a class="nav-item" href="/admin/dealers"><span>▥</span><span>販売店管理</span></a><a class="nav-item admin-only-nav" href="/admin/users"><span>♙</span><span>ユーザー管理</span></a></div><a class="nav-item" href="/help"><span>❓</span><span>ヘルプ</span></a></aside><div class="main"><header class="topbar"><button class="sidebar-toggle" aria-label="メニュー開閉">☰</button><div class="breadcrumb"><strong>案件検索</strong></div><div class="user"><span id="access-banner-text" class="top-access-url"></span><span class="top-user-name" aria-label="ログインユーザー"></span><a class="top-logout" href="/logout">ログアウト</a></div></header><main class="content"><section class="search-card" style="margin-bottom:28px"><div class="search-head"><h1>案件検索</h1><span class="hint">案件名・案件番号・カナ・住所・販売店で検索できます（複数条件はスペース区切りでAND検索、未入力で全件表示）</span></div><form id="search-form"><div class="search-box-wrap" style="display:flex;gap:12px;align-items:center"><input type="text" name="search" id="search-project-input" class="search-project-input" placeholder="案件名・案件番号・カナ・住所・販売店など" autofocus style="flex:1;height:48px;padding:0 16px;font-size:15px;border:1px solid #dbe2ec;border-radius:10px;background:#fbfcfe;outline:none"><button type="submit" class="btn btn-search" style="height:48px;padding:0 28px;white-space:nowrap">検索する</button></div></form></section><div class="head-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:18px;margin:0;color:var(--navy);font-weight:700">検索結果</h2><div style="font-size:13px;color:var(--muted)">該当件数: <strong id="result-count" style="color:var(--navy);font-size:15px">0件</strong></div></div><table class="table"><thead><tr><th data-sort="number" tabindex="0" title="案件番号でソート">案件番号 <span class="sort-indicator"></span></th><th data-sort="name" tabindex="0" title="案件名でソート">案件名 <span class="sort-indicator"></span></th><th>登録データ</th><th>住所</th><th>電話番号</th><th>販売店</th><th data-sort="updated" tabindex="0" title="更新日時でソート">更新日時 <span class="sort-indicator"></span></th></tr></thead><tbody id="results" aria-live="polite"><tr><td colspan="7" style="text-align:center;color:var(--muted)">検索しています…</td></tr></tbody></table></main></div></div>
<script>
function hideProjectPhoneColumn(){const table=document.querySelector('.table');if(!table)return;table.querySelectorAll('tr').forEach(row=>{if(row.dataset.phoneColumnHidden)return;if(row.children.length===1&&row.firstElementChild.colSpan){row.firstElementChild.colSpan=6}else if(row.children.length>4){row.children[4].remove()}row.dataset.phoneColumnHidden='1'})}
hideProjectPhoneColumn();new MutationObserver(hideProjectPhoneColumn).observe(document.querySelector('#results'),{childList:true});
const form=document.querySelector('#search-form'),searchInput=document.querySelector('#search-project-input'),results=document.querySelector('#results'),resultCount=document.querySelector('#result-count'),queryParams=new URLSearchParams(location.search);
const initialQuery=queryParams.get('search')||queryParams.get('q')||queryParams.get('project_name')||queryParams.get('project_number')||queryParams.get('address')||queryParams.get('dealer')||'';
if(searchInput&&initialQuery)searchInput.value=initialQuery;
const sortKeys={number:['number_asc','number_desc'],name:['name_asc','name_desc'],updated:['updated_asc','updated_desc']};
function updateSortIndicators(){document.querySelectorAll('th[data-sort]').forEach(th=>{const key=th.dataset.sort,active=queryParams.get('sort')||'updated_desc',pair=sortKeys[key],indicator=th.querySelector('.sort-indicator');if(indicator)indicator.textContent=active===pair[0]?' ▲':active===pair[1]?' ▼':''})}
document.querySelectorAll('th[data-sort]').forEach(th=>{const activate=()=>{const pair=sortKeys[th.dataset.sort],current=queryParams.get('sort')||'updated_desc';queryParams.set('sort',current===pair[0]?pair[1]:pair[0]);history.replaceState(null,'',location.pathname+'?'+queryParams.toString());updateSortIndicators();loadResults()};th.addEventListener('click',activate);th.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate()}})});
form.addEventListener('submit',e=>{
  e.preventDefault();
  const val=(searchInput?searchInput.value:'').trim();
  if(val)queryParams.set('search',val);else queryParams.delete('search');
  history.replaceState(null,'',location.pathname+(queryParams.toString()?'?'+queryParams.toString():''));
  loadResults();
});
async function loadResults(){
  results.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted)">検索しています…</td></tr>';
  try{
    const res=await fetch('/api/projects?'+queryParams.toString(),{cache:'no-store'});
    if(res.status===401){location.href='/';return}
    if(!res.ok)throw new Error();
    const projects=await res.json();
    resultCount.textContent=projects.length+'件';
    if(!projects.length){
      results.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--muted)">該当する案件はありません。</td></tr>';
      return;
    }
    results.innerHTML='';
    let idx=0;
    function renderChunk(){
      const fragment=document.createDocumentFragment();
      const end=Math.min(idx+50,projects.length);
      for(;idx<end;idx++){
        const p=projects[idx];
        const tr=document.createElement('tr');
        tr.className='clickable-row';
        tr.onclick=()=>window.location.href='/projects/'+p.id;
        tr.innerHTML=`<td><span class="project-number">${escapeHtml(p.project_number)}</span></td><td><div class="project-name-content"><span class="project-name">${escapeHtml(p.name)}</span><span class="project-kana">${escapeHtml(p.kana||"")}</span></div></td><td><div style="display:flex;gap:4px;flex-direction:column;align-items:flex-start"><span class="badge">書類: ${p.documents_count||0}</span><span class="badge photo-badge">写真: ${p.pictures_count||0}</span></div></td><td>${projectAddressLabel(p)}</td><td>${escapeHtml(p.phone||'未登録')}</td><td><span class="dealer-text">${escapeHtml(p.dealer||'未登録')}</span></td><td>${escapeHtml(p.updated_at||'未登録')}</td>`;
        fragment.appendChild(tr);
      }
      results.appendChild(fragment);
      if(idx<projects.length)requestAnimationFrame(renderChunk);
    }
    requestAnimationFrame(renderChunk);
  }catch{
    resultCount.textContent='';
    results.innerHTML='<tr><td colspan="7" style="text-align:center;color:#b91c1c">検索結果の取得に失敗しました。</td></tr>';
  }
}
function projectAddressLabel(project){const address=project.address&&project.address.trim()?escapeHtml(project.address):'<span style="color:var(--muted)">未登録</span>';const position=project.plus_code?escapeHtml(project.plus_code):(project.latitude!==null&&project.longitude!==null?escapeHtml(project.latitude+', '+project.longitude):'');return `<span class="address-text">${address}</span>${position?`<span class="position-text">${position}</span>`:''}`}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
updateSortIndicators();
