d:#f8faff;color:var(--muted);font-weight:700}.clickable-row{cursor:pointer;transition:background .14s,box-shadow .14s}.clickable-row:hover{background:#f8faff;box-shadow:inset 3px 0 0 var(--blue)}.project-kana{display:block;margin-top:4px;font-size:11px;font-weight:500;color:var(--muted)}.btn-sm{padding:4px 10px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--navy);cursor:pointer;font-weight:600;margin-right:6px}.btn-sm:hover{border-color:#9bbcf5;color:var(--blue);background:#f8faff}.error{color:#b91c1c;font-size:13px}.success{color:#15803d;font-size:13px}@media(max-width:820px){.sidebar{width:72px;padding:20px 10px}.brand{padding:0 9px 36px}.brand span,.nav-label,.nav-item span,.sidebar-foot{display:none}.nav-item{justify-content:center}.nav-item.active:before{margin-left:-10px}.topbar{padding:0 24px}.content{padding:30px 24px}.form-grid{grid-template-columns:1fr}}@media(max-width:560px){.topbar{height:62px;padding:0 12px}.user{gap:6px}.top-access-url{max-width:42vw;padding:0 8px}.top-user-name{max-width:36vw}.top-logout{padding:0 9px}.content{padding:26px 16px}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');

utton class="sidebar-toggle" aria-label="メニュー開閉">☰</button><div class="breadcrumb">管理メニュー　/　<strong>販売店管理</strong></div><div class="user"><span id="access-banner-text" class="top-access-url"></span><span class="top-user-name" aria-label="ログインユーザー"></span><a class="top-logout" href="/logout">ログアウト</a></div></header><main class="content"><div class="card"><div class="head-row"><h1>販売店管理</h1><div class="head-actions"><button class="btn secondary deleted-toggle" data-admin-only-control onclick="loadDeletedDealers()">削除済みを表示</button><button class="btn" onclick="toggleForm()">＋ 新規販売店登録</button></div></div><div id="form-panel" class="form-panel" style="position:fixed;inset:0;margin:auto;width:min(420px,calc(100vw - 24px));height:max-content;z-index:101;box-shadow:0 20px 60px rgba(0,0,0,.25);border-radius:12px;padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 id="dealer-form-title" style="font-size:16px;margin:0">新規販売店登録</h2><button type="button" onclick="closeDealerForm()" style="margin:0;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div><form id="dealer-form"><div class="form-grid" style="grid-template-columns:1fr;gap:8px"><div><label>販売店名</label><input name="name" required></div><div><label>販売店名カナ</label><input name="kana"></div><div><label>住所（任意）</label><input name="address"></div><div><label>電話番号（任意）</label><input name="phone" type="tel"></div><div><label>メールアドレス（任意）</label><input name="email" type="email" autocomplete="email"></div><div><label>FAX（任意）</label><input name="fax" type="tel"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button type="button" class="btn secondary btn-cancel" onclick="closeDealerForm()" style="margin-top:0">キャンセル</button><button type="submit" class="btn btn-submit" id="dealer-submit" style="margin-top:0">登録する</button></div><p id="message" style="margin:6px 0 0"></p></form></div><table class="table"><thead><tr><th>販売店名</th><th>住所</th><th>電話番号 / FAX</th><th>メールアドレス</th><th>登録件数</th><th>操作</th></tr></thead><tbody id="dealer-list"><tr><td colspan="6" style="text-align:center;color:var(--muted)">読み込み中…</td></tr></tbody></table><div id="deleted-dealers-panel" style="display:none;margin-top:28px"><h2 style="font-size:16px;margin:0 0 12px">削除済み販売店</h2><table class="table"><thead><tr><th>販売店名</th><th>住所</th><th>電話番号 / FAX</th><th>削除日時</th><th>操作</th></tr></thead><tbody id="deleted-dealer-list"><tr><td colspan="5" style="text-align:center;color:var(--muted)">読み込み中…</td></tr></tbody></table></div></div></main></div></div><div id="dealer-note-modal" style="display:none;position:fixed;inset:0;background:rgba(18,35,61,.36);place-items:center;z-index:100"><div style="background:#fff;border-radius:14px;padding:24px;width:min(580px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.24)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 id="dealer-note-title" style="font-size:18px;margin:0">販売店メモ</h2><button type="button" class="btn secondary deleted-toggle" onclick="loadDeletedDealerNotes()">削除済みを表示</button><button type="button" onclick="closeDealerNoteModal()" style="background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div><form id="dealer-note-form" style="margin-bottom:20px"><textarea name="content" required placeholder="メモを入力してください..." style="width:100%;height:75px;border:1px solid #dbe2ec;border-radius:8px;padding:10px;font:inherit;font-size:13px;outline:0;resize:vertical"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span id="dealer-note-msg"></span><button class="btn" style="height:36px;padding:0 18px;margin-top:0">メモを追加</button></div></form><div id="dealer-note-list" style="max-height:300px;overflow-y:auto;border-top:1px solid var(--line);padding-top:12px"><p class="no-file">読み込み中…</p></div></div></div><div id="contacts-panel" style="display:none;position:fixed;inset:0;background:rgba(18,35,61,.36);place-items:center;z-index:100"><div style="background:#fff;border-radius:14px;padding:24px;width:min(580px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.24)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 id="contacts-title" style="font-size:18px;margin:0">担当者管理</h2><button type="button" onclick="closeContacts()" style="background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button type="button" class="btn" onclick="openContactForm()">＋ 担当者登録</button></div><table class="table"><thead><tr><th>担当者名</th><th>電話番号</th><th>メールアドレス</th><th>操作</th></tr></thead><tbody id="contact-list"></tbody></table></div></div><div id="contact-form-panel" style="display:none;position:fixed;inset:0;background:rgba(18,35,61,.36);place-items:center;z-index:101"><div style="background:#fff;border-radius:14px;padding:20px;width:min(420px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(18,35,61,.22)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 id="contact-form-title" style="font-size:16px;margin:0">担当者登録</h2><button type="button" onclick="closeContactForm()" style="background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div><form id="contact-form"><div class="form-grid" style="grid-template-columns:1fr;gap:8px"><div><label>担当者名</label><input name="name" required></div><div><label>電話番号</label><input name="phone" required></div><div><label>メールアドレス（任意）</label><input name="email" type="email" autocomplete="email"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button type="button" class="btn secondary" onclick="closeContactForm()">キャンセル</button><button type="submit" class="btn" id="contact-submit">登録する</button></div><p id="contact-message"></p></form></div></div></div>
<script>
let currentContactDealer = '';
const contactsPanel = document.getElementById('contacts-panel');
const contactForm = document.getElementById('contact-form');
const contactList = document.getElementById('contact-list');
const contactMessage = document.getElementById('contact-message');
const contactFormPanel = document.getElementById('contact-form-panel');
const contactFormTitle = document.getElementById('contact-form-title');
const contactSubmit = document.getElementById('contact-submit');
let contactEditId = null;
function normalizePhoneInput(value) {
    return String(value || '')
        .replace(/[０-９]/g, character => String.fromCharCode(character.charCodeAt(0) - 65248))
        .replace(/[^0-9]/g, '');
}

function openContacts(dealerName) {
    currentContactDealer = dealerName;
    document.getElementById('contacts-title').textContent = dealerName + ' の担当者';
    contactsPanel.style.display = 'grid';
    loadContacts();
}
function closeContacts() {
    contactsPanel.style.display = 'none';
    closeContactForm();
}
function openContactForm(id = null, name = '', phone = '', email = '') {
    contactEditId = id;
    contactForm.reset();
    contactForm.name.value = name;
    contactForm.phone.value = phone;
    contactForm.email.value = email;
    contactFormTitle.textContent = id ? '担当者編集' : '担当者登録';
    contactSubmit.textContent = id ? '更新する' : '登録する';
    contactMessage.textContent = '';
    contactMessage.className = '';
    contactFormPanel.style.display = 'grid';
}
function closeContactForm() {
    contactEditId = null;
    contactFormPanel.style.display = 'none';
}
async function loadContacts() {
    try {
        const res = await fetch('/api/dealers/' + encodeURIComponent(currentContactDealer) + '/contacts');
        if (!res.ok) throw new Error();
        const contacts = await res.json();
        contactList.innerHTML = contacts.length ? contacts.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email || '未登録')}</td><td><button class="btn-sm" onclick="openContactForm(${c.id},'${jsEsc(c.name)}','${jsEsc(c.phone)}','${jsEsc(c.email || '')}')">編集</button> <button class="btn-sm danger" onclick="deleteContact(${c.id})">削除</button></td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted)">登録されていません。</td></tr>';
    } catch {
        contactList.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#b91c1c">読み込みに失敗しました。</td></tr>';
    }
}
contactForm.addEventListener('submit', async e => {
    e.preventDefault();
    contactMessage.textContent = '';
    contactMessage.className = '';
    const data = Object.fromEntries(new FormData(contactForm));
    try {
        const url = contactEditId
            ? '/api/contacts/' + contactEditId
            : '/api/dealers/' + encodeURIComponent(currentContactDealer) + '/contacts';
        const res = await fetch(url, {
            method: contactEditId ? 'PUT' : 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(await res.text());
        closeContactForm();
        loadContacts();
    } catch (err) {
        contactMessage.className = 'error';
        contactMessage.textContent = err.message;
    }
});
contactForm.phone.addEventListener('blur', () => {
    contactForm.phone.value = normalizePhoneInput(contactForm.phone.value);
});
const dealerForm = document.querySelector('#dealer-form');
dealerForm.phone.addEventListener('blur', () => {
    dealerForm.phone.value = normalizePhoneInput(dealerForm.phone.value);
});
dealerForm.fax.addEventListener('blur', () => {
    dealerForm.fax.value = normalizePhoneInput(dealerForm.fax.value);
});
async function deleteContact(id) {
    if(!confirm('この担当者を削除しますか？')) return;
    try {
        const res = await fetch('/api/contacts/' + id, {method: 'DELETE'});
        if (!res.ok) throw new Error(await res.text());
        loadContacts();
    } catch (err) {
        alert('削除に失敗しました。');
    }
}
