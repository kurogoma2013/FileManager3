="top-user-name" aria-label="ログインユーザー"></span><a class="top-logout" href="/logout">ログアウト</a></div></header><main class="content"><div class="card"><div class="head-row"><h1>ユーザー管理</h1><button class="btn" onclick="openUserCreate()">＋ 新規ユーザー登録</button></div><div id="user-dialog" class="dialog-backdrop"><div id="form-panel" class="form-panel"><div class="dialog-head"><h2 id="user-form-title" style="font-size:16px;margin:0">新規ユーザー登録</h2><button type="button" class="dialog-close" onclick="closeUserDialog()">✕</button></div><form id="user-form"><div class="form-grid" style="grid-template-columns:1fr;gap:8px"><div><label>ユーザー名</label><input name="username" required></div><div><label>パスワード（8文字以上）</label><input name="password" type="password" required minlength="8"></div><div><label>ロール</label><select name="role"><option value="member">member（一般ユーザー）</option><option value="admin">admin（管理ユーザー）</option><option value="viewer">viewer（閲覧ユーザー）</option></select></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button type="button" class="btn secondary btn-cancel" onclick="closeUserDialog()" style="margin-top:0">キャンセル</button><button type="submit" class="btn btn-submit" id="user-submit" style="margin-top:0">登録する</button></div><p id="message" style="margin:6px 0 0"></p></form></div></div><table class="table"><thead><tr><th>ID</th><th>ユーザー名</th><th>ロール</th><th>登録日時</th><th>パスキー</th><th>操作</th></tr></thead><tbody id="user-list"><tr><td colspan="6" style="text-align:center;color:var(--muted)">読み込み中…</td></tr></tbody></table></div></main></div></div><script>const form=document.querySelector('#user-form'),message=document.querySelector('#message'),userList=document.querySelector('#user-list'),dialog=document.querySelector('#user-dialog'),formPanel=document.querySelector('#form-panel'),title=document.querySelector('#user-form-title'),submitButton=document.querySelector('#user-submit');let userEditId=null;function openUserCreate(){userEditId=null;form.reset();form.username.readOnly=false;form.password.required=true;form.password.placeholder='パスワード';title.textContent='新規ユーザー登録';submitButton.textContent='登録する';message.textContent='';message.className='';dialog.style.display='grid'}function openUserEdit(id,username,role){userEditId=id;form.reset();form.username.value=username;form.username.readOnly=true;form.role.value=role;form.password.required=false;form.password.placeholder='変更しない場合は空欄';title.textContent='ユーザー編集';submitButton.textContent='更新する';message.textContent='';message.className='';dialog.style.display='grid'}function closeUserDialog(){userEditId=null;form.reset();form.username.readOnly=false;form.password.required=true;message.textContent='';message.className='';dialog.style.display='none'}async function loadUsers(){try{const res=await fetch('/api/users');if(!res.ok)throw new Error();const users=await res.json();userList.innerHTML=users.length?users.map(u=>`<tr><td>${u.id}</td><td><strong>${esc(u.username)}</strong></td><td>${roleLabel(u.role)}</td><td>${esc(u.created_at||'')}</td><td>${u.passkey_count||0}件</td><td><button class="btn-sm" onclick="openUserEdit(${u.id},'${esc(u.username)}','${roleLabel(u.role)}')">✏ 編集</button> <button class="btn-sm" onclick="registerUserPasskey(${u.id})">パスキー登録</button> ${u.passkey_count>0?` <button class="btn-sm" onclick="deleteUserPasskeys(${u.id})">パスキー削除</button>`:''} <button class="btn-sm" onclick="deleteUser(${u.id}, '${esc(u.username)}')">削除</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted)">登録されているユーザーはありません。</td></tr>'}catch{userList.innerHTML='<tr><td colspan="6" style="text-align:center;color:#b91c1c">ユーザー一覧の取得に失敗しました。</td></tr>'}}function roleLabel(role){return ({admin:"管理ユーザー",member:"一般ユーザー",viewer:"閲覧ユーザー"})[role]||role}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function b64uToBuf(v){v=v.replace(/-/g,'+').replace(/_/g,'/');v+='='.repeat(
