<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>管理メニュー | FileManager3</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:#182230;background:#f6f8fb;--navy:#12233d;--blue:#3977e8;--muted:#758195;--line:#e7ebf2}*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:inherit}.app{display:flex;min-height:100vh}.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:248px;background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750;padding:0 12px 38px}.brand-mark{width:34px;height:34px;border-radius:10px;background:#4b8cf5;display:grid;place-items:center;font-size:19px}.nav-label{font-size:10px;color:#8294b1;letter-spacing:.14em;padding:0 12px 10px}.nav-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:#b9c7dc;padding:12px;border-radius:9px;font-size:14px}.nav-item.active,.nav-item:hover{background:#203957;color:#fff}.nav-item.active:before{content:"";height:18px;width:3px;background:#62a0ff;border-radius:3px;margin-left:-12px}.admin-nav-link{display:none}.sidebar-foot{color:#8294b1;font-size:11px;padding:12px}.main{flex:1;min-width:0}.topbar{position:sticky;top:0;z-index:12;height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 42px}.breadcrumb{font-size:13px;color:var(--muted)}.user{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}.top-access-url{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;min-height:38px;max-width:320px;padding:6px 12px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;color:#64748b;font-size:10px;font-weight:500;line-height:1.4;white-space:pre-line;word-break:break-all;text-align:center}.top-user-name{display:inline-flex;align-items:center;max-width:220px;color:var(--navy);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-logout{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;color:#475569;text-decoration:none;font-size:12px;font-weight:600;background:#fff;transition:0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.02)}.top-logout:hover{border-color:#cbd5e1;color:#0f172a;background:#f8fafc}.content{max-width:1180px;margin:0 auto;padding:42px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px;box-shadow:0 5px 20px #1b33500b;max-width:720px}.menu{display:block;padding:18px;border:1px solid var(--line);border-radius:11px;margin-top:14px;text-decoration:none;transition:.16s}.menu:hover{border-color:#9bbcf5;background:#f8faff;transform:translateY(-1px);box-shadow:0 4px 12px #1b33500d}.menu strong{display:block;font-size:15px;color:var(--blue);margin-bottom:4px}.menu span{font-size:12px;color:var(--muted)}@media(max-width:820px){.sidebar{width:72px;padding:20px 10px}.brand{padding:0 9px 36px}.brand span,.nav-label,.nav-item span,.sidebar-foot{display:none}.nav-item{justify-content:center}.nav-item.active:before{margin-left:-10px}.topbar{padding:0 24px}.content{padding:30px 24px}}@media(max-width:560px){.topbar{height:62px;padding:0 12px}.user{gap:6px}.top-access-url{max-width:42vw;padding:0 8px}.top-user-name{max-width:36vw}.top-logout{padding:0 9px}.content{padding:26px 16px}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root {

.top-logout:hover, .icon-btn:hover, .photo-menu-btn:hover, .edit-btn:hover {

@supports (padding: max(0px)) { .topbar { padding-top: env(safe-area-inset-top); min-height: calc(62px + env(safe-area-inset-top)); height: auto; } .sidebar { padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); } .content { padding-bottom: calc(24px + env(safe-area-inset-bottom)); } @media(max-width:820px){.topbar{padding-top:env(safe-area-inset-top)!important;min-height:calc(62px + env(safe-area-inset-top));height:auto!important}.sidebar{padding-top:calc(20px + env(safe-area-inset-top))!important;padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}.content{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}} button, .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; } }

  .sidebar-toggle { display: block; }

/* ui-consistency */:root{--ui-radius:8px;--ui-control-height:38px}body{-webkit-font-smoothing:antialiased}.card,.panel,.form-panel{border-radius:var(--ui-radius);box-shadow:0 8px 24px rgba(18,35,61,.08)}.topbar{background:#fff;backdrop-filter:none}.btn,button{min-height:var(--ui-control-height);border-radius:var(--ui-radius);box-shadow:none;transform:none;transition:background-color .15s ease,border-color .15s ease,color .15s ease}.btn:hover,button:hover{transform:none;box-shadow:none}.btn-sm{min-height:32px;border-radius:6px}input,select,textarea{border-radius:var(--ui-radius)}.table th,.table td{padding:12px 14px}.dialog-backdrop,.modal-backdrop{background:rgba(18,35,61,.36)}@media(max-width:560px){input,select,textarea{font-size:16px;min-height:44px}.btn,.btn-sm,button{min-height:44px}.content{padding:24px 16px}}</style></head><body><div class="app"><div class="sidebar-overlay"></div><aside class="sidebar"><div class="brand"><div class="brand-mark">⌂</div><span>FileManager<span style="color:#73a5ff">3</span><small style="display:block;font-size:10px;color:#8294b1;margin-top:3px;font-weight:500">v20260915.00</small></span></div><a class="nav-item" href="/"><span>⌕</span><span>案件検索</span></a><a class="nav-item active admin-nav-link" href="/admin"><span>⚙</span><span>管理メニュー</span></a><div class="nav-submenu admin-nav-link" style="margin-left:18px;border-left:1px solid #36506f;padding-left:8px"><a class="nav-item" href="/admin/projects"><span>▤</span><span>案件管理</span></a><a class="nav-item" href="/admin/dealers"><span>▥</span><span>販売店管理</span></a><a class="nav-item admin-only-nav" href="/admin/specifications"><span>▧</span><span>仕様書</span></a><a class="nav-item admin-only-nav" href="/admin/users"><span>♙</span><span>ユーザー管理</span></a></div><a class="nav-item" href="/help"><span>❓</span><span>ヘルプ</span></a></aside><div class="main"><header class="topbar"><button class="sidebar-toggle" aria-label="メニュー開閉">☰</button><div class="breadcrumb"><strong>管理メニュー</strong></div><div class="user"><span id="access-banner-text" class="top-access-url"></span><span class="top-user-name" aria-label="ログインユーザー"></span><a class="top-logout" href="/logout">ログアウト</a></div></header><main class="content"><div class="card"><h1 style="font-size:24px;margin:0 0 6px">管理メニュー</h1><p style="color:var(--muted);font-size:13px;margin:0 0 18px">案件・販売店・ユーザーなどの登録および設定管理を行います。</p><a class="menu" href="/admin/projects"><strong>案件管理</strong><span>案件の新規登録・一覧確認・情報の編集を行います。</span></a><a class="menu" href="/admin/dealers"><strong>販売店管理</strong><span>販売店の新規登録・一覧確認・名称および住所の編集を行います。</span></a><a class="menu admin-only-nav" href="/admin/specifications"><strong>仕様書</strong><span>FileManager3の仕様・権限・画面・API設計を確認します。</span></a><a class="menu admin-only-nav" href="/admin/users"><strong>ユーザー管理</strong><span>FileManagerを利用するユーザーの一覧確認・新規登録・設定編集を行います。</span></a></div></main></div></div><script>(function(){function topCacheGet(k){try{return sessionStorage.getItem(k)||""}catch(_){return ""}}function topCacheSet(k,v){try{if(v)sessionStorage.setItem(k,v)}catch(_){}}function setTopUserName(username,role){if(!username)return;var r=role||topCacheGet("fm3_top_role")||"viewer";var rl=r==='admin'?'管理ユーザー':(r==='member'?'一般ユーザー':'閲覧ユーザー');var bc=r==='admin'?'#1d4ed8':(r==='editor'?'#4b8cf5':'#8294b1');var h='<div style="display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px 12px;font-size:17px;color:#334155;font-weight:700;max-width:100%;line-height:1.2;box-shadow:0 1px 2px rgba(0,0,0,0.03);"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;text-align:center;" title="'+username+'">'+username+'</span><span style="background:'+bc+';color:#fff;font-size:12px;padding:4px 9px;border-radius:4px;margin-top:4px;font-weight:700;letter-spacing:0.02em;box-shadow:0 1px 2px '+bc+'40;">'+rl+'</span></div>';var u=document.querySelectorAll('.topbar .user .top-user-name');u.forEach(function(e){if(e.innerHTML!==h){e.innerHTML=h;e.style.display='block';e.style.border='none';e.style.background='none';e.style.padding='0';e.style.maxWidth='none';}})}function setTopAccessAddress(value){var box=document.querySelector("#access-banner-text");if(!box||!value)return;if(box.textContent!==value)box.textContent=value;var idxBox=document.querySelector("#index-access-url");if(idxBox&&idxBox.textContent!==value)idxBox.textContent=value}function setAdminMenuVisibility(role){var canManage=role==="admin"||role==="member";document.querySelectorAll(".admin-nav-link").forEach(function(e){e.style.display=canManage?(e.classList.contains("nav-submenu")?"block":"flex"):"none"});document.querySelectorAll(".admin-only-nav").forEach(function(e){e.style.display=role==="admin"?"":"none"});if(role!=="admin")document.querySelectorAll("[data-admin-only-control]").forEach(function(e){e.remove()})}setTopUserName(topCacheGet("fm3_top_username"));setTopAccessAddress(topCacheGet("fm3_top_access_url"));setAdminMenuVisibility(topCacheGet("fm3_top_role"));try{fetch('/api/me',{cache:"no-store"}).then(function(r){if(r.ok)return r.json()}).then(function(d){if(!d||!d.username)return;topCacheSet("fm3_top_username",d.username);topCacheSet("fm3_top_role",d.role||"");setTopUserName(d.username,d.role);setAdminMenuVisibility(d.role)}).catch(function(_){})}catch(_){}function loadTopAccessAddress(){var box=document.querySelector("#access-banner-text");if(!box)return;try{fetch("/api/access-urls").then(function(r){if(r.ok)return r.json()}).then(function(d){var value="LAN公開起動時に表示されます。";if(d&&d.lan_url){value="📱 LAN・モバイル用アドレス\n"+d.lan_url;var hUrl=d.urls?d.urls.find(function(u){return u!==d.local_url&&u!==d.lan_url}):null;if(hUrl)value+="\n🌐 ホスト名での接続\n"+hUrl;}topCacheSet("fm3_top_access_url",value);setTopAccessAddress(value)}).catch(function(_){setTopAccessAddress(topCacheGet("fm3_top_access_url")||"取得できませんでした。")})}catch(_){setTopAccessAddress(topCacheGet("fm3_top_access_url")||"取得できませんでした。")}}loadTopAccessAddress();function selectSideNavItem(){try{var path=location.pathname;var current=document.querySelector('.sidebar a[href="'+path+'"]');if(!current)return;document.querySelectorAll('.sidebar a.nav-item').forEach(function(item){item.classList.remove('active')});current.classList.add('active')}catch(_){}}selectSideNavItem();function markInternal(){try{sessionStorage.setItem('fm3_internal_nav','1');setTimeout(function(){sessionStorage.removeItem('fm3_internal_nav')},2000)}catch(_){}}document.addEventListener('click',function(e){var t=e.target&&e.target.closest&&e.target.closest('a[href],.clickable-row');if(t)markInternal()},true);document.addEventListener('submit',markInternal,true);window.addEventListener('pagehide',function(){try{if(sessionStorage.getItem('fm3_internal_nav'))return;navigator.sendBeacon('/api/logout-on-close')}catch(_){try{fetch('/api/logout-on-close',{method:'POST',keepalive:true})}catch(__){}}})
var st = document.querySelector('.sidebar-toggle');
var so = document.querySelector('.sidebar-overlay');
if (st && so) {

}
})();</script></body></html>
