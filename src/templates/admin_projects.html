<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>案件管理 | FileManager3</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:#182230;background:#f6f8fb;--navy:#12233d;--blue:#3977e8;--muted:#758195;--line:#e7ebf2}*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:inherit}.app{display:flex;min-height:100vh}.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:248px;background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750;padding:0 12px 38px}.brand-mark{width:34px;height:34px;border-radius:10px;background:#4b8cf5;display:grid;place-items:center;font-size:19px}.nav-label{font-size:10px;color:#8294b1;letter-spacing:.14em;padding:0 12px 10px}.nav-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:#b9c7dc;padding:12px;border-radius:9px;font-size:14px}.nav-item.active,.nav-item:hover{background:#203957;color:#fff}.nav-item.active:before{content:"";height:18px;width:3px;background:#62a0ff;border-radius:3px;margin-left:-12px}.admin-nav-link{display:none}.sidebar-foot{color:#8294b1;font-size:11px;padding:12px}.main{flex:1;min-width:0}.topbar{position:sticky;top:0;z-index:12;height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 42px}.breadcrumb{font-size:13px;color:var(--muted)}.user{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}.top-access-url{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;min-height:38px;max-width:320px;padding:6px 12px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;color:#64748b;font-size:10px;font-weight:500;line-height:1.4;white-space:pre-line;word-break:break-all;text-align:center}.top-user-name{display:inline-flex;align-items:center;max-width:220px;color:var(--navy);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-logout{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;color:#475569;text-decoration:none;font-size:12px;font-weight:600;background:#fff;transition:0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.02)}.top-logout:hover{border-color:#cbd5e1;color:#0f172a;background:#f8fafc}.content{max-width:1180px;margin:0 auto;padding:42px}.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12px;margin-bottom:24px}.back:hover{color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px;box-shadow:0 5px 20px #1b33500b}.head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head-row h1{font-size:24px;margin:0}.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;padding:9px 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;border:0;transition:.16s}.btn:hover{background:#2c65d0}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.secondary:hover{border-color:#9bbcf5;color:var(--blue);background:#f8faff}.form-panel{display:none;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#59677b}input{width:100%;height:43px;border:1px solid #dbe2ec;border-radius:8px;padding:0 12px;font:inherit;font-size:13px;outline:0;background:#fff}input:focus{border-color:#5b90ed;box-shadow:0 0 0 3px #3977e81a}.location{grid-column:1 / -1;border:1px solid var(--line);padding:16px;border-radius:10px;background:#fff}.location h2{font-size:14px;margin:0 0 4px}.hint{font-size:12px;color:var(--muted);margin:0 0 12px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{background:#f8faff;color:var(--muted);font-weight:700}.clickable-row{cursor:pointer;transition:background .14s,box-shadow .14s}.clickable-row:hover{background:#f8faff;box-shadow:inset 3px 0 0 var(--blue)}.project-kana{display:block;margin-top:4px;font-size:11px;font-weight:500;color:var(--muted)}.btn-sm{padding:4px 10px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--navy);cursor:pointer;font-weight:600}.btn-sm:hover{border-color:#9bbcf5;color:var(--blue);background:#f8faff}.error{color:#b91c1c;font-size:13px}.success{color:#15803d;font-size:13px}@media(max-width:820px){.sidebar{width:72px;padding:20px 10px}.brand{padding:0 9px 36px}.brand span,.nav-label,.nav-item span,.sidebar-foot{display:none}.nav-item{justify-content:center}.nav-item.active:before{margin-left:-10px}.topbar{padding:0 24px}.content{padding:30px 24px}.form-grid{grid-template-columns:1fr}.location{grid-column:auto}}@media(max-width:560px){.topbar{height:62px;padding:0 12px}.user{gap:6px}.top-access-url{max-width:42vw;padding:0 8px}.top-user-name{max-width:36vw}.top-logout{padding:0 9px}.content{padding:26px 16px}.head-row{display:block}.head-row .btn{margin-top:14px}.table{display:block;overflow-x:auto;white-space:nowrap}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root {
  font-family: 'Inter', 'Noto Sans JP', sans-serif !important;
  color: #0f172a;
  background: #f8fafc;
  --navy: #0f172a;
  --blue: #2563eb;

.card, .panel, .form-panel {

  border: 1px solid rgba(226, 232, 240, 0.8) !important;

  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01) !important;

  background: rgba(255, 255, 255, 0.85) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.6) !important;
}
.btn {
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
  box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2), 0 2px 4px -2px rgba(37, 99, 235, 0.1) !important;
  border-radius: 10px !important;
}
.btn:hover {
  background: #1d4ed8 !important;
  transform: translateY(-2px);
  box-shadow: 0 6px 10px -1px rgba(37, 99, 235, 0.3), 0 2px 4px -2px rgba(37, 99, 235, 0.1) !important;
}
.btn.secondary {
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
}
.btn.secondary:hover {
  border-color: #cbd5e1 !important; background: #f8fafc !important; color: var(--blue) !important;
  transform: translateY(-2px);
}
.btn-sm {
  transition: all 0.2s ease !important; border-radius: 8px !important;
}
.btn-sm:hover:not(:disabled) {
  transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
.table th, .table td { padding: 16px !important; }
.clickable-row { transition: all 0.2s ease !important; }
.clickable-row:hover { background: #f1f5f9 !important; box-shadow: inset 4px 0 0 var(--blue) !important; }
.menu, .icon-btn, .photo-menu-btn, .top-logout, .edit-btn {
  transition: all 0.2s ease !important;
}
.top-logout:hover, .icon-btn:hover, .photo-menu-btn:hover, .edit-btn:hover {

  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05) !important;

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe}
.photo-badge{background:#ecfeff;color:#0891b2;border-color:#a5f3fc}

.sidebar-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--navy); padding: 0; margin-right: 12px; min-width: 44px; min-height: 44px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@supports (padding: max(0px)) { .topbar { padding-top: env(safe-area-inset-top); min-height: calc(62px + env(safe-area-inset-top)); height: auto; } .sidebar { padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); } .content { padding-bottom: calc(24px + env(safe-area-inset-bottom)); } @media(max-width:820px){.topbar{padding-top:env(safe-area-inset-top)!important;min-height:calc(62px + env(safe-area-inset-top));height:auto!important}.sidebar{padding-top:calc(20px + env(safe-area-inset-top))!important;padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}.content{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}} button, .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; } }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; opacity: 0; transition: opacity 0.3s; }

  .sidebar .brand > span, .sidebar .nav-label, .sidebar .nav-item span, .sidebar .sidebar-foot { display: block !important; }

}

/* ui-consistency */:root{--ui-radius:8px;--ui-control-height:38px}body{-webkit-font-smoothing:antialiased}.card,.panel,.form-panel{border-radius:var(--ui-radius);box-shadow:0 8px 24px rgba(18,35,61,.08)}.topbar{background:#fff;backdrop-filter:none}.btn,button{min-height:var(--ui-control-height);border-radius:var(--ui-radius);box-shadow:none;transform:none;transition:background-color .15s ease,border-color .15s ease,color .15s ease}.btn:hover,button:hover{transform:none;box-shadow:none}.btn-sm{min-height:32px;border-radius:6px}input,select,textarea{border-radius:var(--ui-radius)}.table th,.table td{padding:12px 14px}.address-text{display:block;color:#334155;line-height:1.45;white-space:normal;word-break:break-word}.position-text{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.35;white-space:normal;word-break:break-word}.dialog-backdrop,.modal-backdrop{background:rgba(18,35,61,.36)}.head-actions,.panel-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.deleted-toggle{align-self:center;margin:0;min-width:140px;justify-content:center;white-space:nowrap}@media(max-width:560px){input,select,textarea{font-size:16px;min-height:44px}.btn,.btn-sm,button{min-height:44px}.content{padding:24px 16px}}</style></head><body><div class="app"><div class="sidebar-overlay"></div><aside class="sidebar"><div class="brand"><div class="brand-mark">⌂</div><span>FileManager<span style="color:#73a5ff">3</span><small style="display:block;font-size:10px;color:#8294b1;margin-top:3px;font-weight:500">v20260915.00</small></span></div><a class="nav-item" href="/"><span>⌕</span><span>案件検索</span></a><a class="nav-item active admin-nav-link" href="/admin"><span>⚙</span><span>管理メニュー</span></a><div class="nav-submenu admin-nav-link" style="margin-left:18px;border-left:1px solid #36506f;padding-left:8px"><a class="nav-item" href="/admin/projects"><span>▤</span><span>案件管理</span></a><a class="nav-item" href="/admin/dealers"><span>▥</span><span>販売店管理</span></a><a class="nav-item admin-only-nav" href="/admin/users"><span>♙</span><span>ユーザー管理</span></a></div><a class="nav-item" href="/help"><span>❓</span><span>ヘルプ</span></a></aside><div class="main"><header class="topbar"><button class="sidebar-toggle" aria-label="メニュー開閉">☰</button><div class="breadcrumb">管理メニュー　/　<strong>案件管理</strong></div><div class="user"><span id="access-banner-text" class="top-access-url"></span><span class="top-user-name" aria-label="ログインユーザー"></span><a class="top-logout" href="/logout">ログアウト</a></div></header><main class="content"><div class="card"><div class="head-row"><h1>案件管理</h1><div class="head-actions"><button class="btn secondary deleted-toggle" data-admin-only-control onclick="loadDeletedProjects()">削除済みを表示</button><button class="btn" onclick="openProjectForm()">＋ 新規案件登録</button></div></div><div id="project-form-panel" class="form-panel" style="position:fixed;inset:0;margin:auto;width:min(420px,calc(100vw - 24px));height:max-content;max-height:calc(100vh - 48px);overflow:auto;z-index:101;box-shadow:0 20px 60px rgba(0,0,0,.25);border-radius:12px;padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 id="project-form-title" style="font-size:16px;margin:0">新規案件登録</h2><button type="button" onclick="closeProjectForm()" style="margin:0;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div><form id="project-form"><div class="form-grid" style="grid-template-columns:1fr;gap:8px"><div><label>案件番号</label><input name="project_number" type="text" style="ime-mode: disabled;" inputmode="numeric" pattern="[0-9]*" min="0" onblur="this.value=normalizeProjectNumber(this.value)" required></div><div><label>販売店</label><input name="dealer" list="dealers-list" required></div><div><label>担当者</label><input name="assignee" id="form-assignee" list="assignees-list" autocomplete="off"></div><div><label>案件名</label><input name="name" required></div><div><label>案件名カナ</label><input name="kana" required></div><div><label>電話番号（任意）</label><input name="phone" type="tel"></div><div><label>メールアドレス（任意）</label><input name="email" type="email" autocomplete="email"></div><div><label>住所（任意）</label><input name="address"></div><div><label>位置情報（任意）</label><input id="location-input"></div></div><datalist id="dealers-list"></datalist><datalist id="assignees-list"></datalist><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button type="button" class="btn secondary btn-cancel" onclick="closeProjectForm()" style="margin-top:0">キャンセル</button><button type="submit" class="btn btn-submit" id="project-submit" style="margin-top:0">登録する</button></div><p id="message" style="margin:6px 0 0"></p></form></div><table class="table"><thead><tr><th>案件番号</th><th>案件名</th><th>登録データ</th><th>住所</th><th>電話番号</th><th>メールアドレス</th><th>販売店</th><th>操作</th></tr></thead><tbody id="project-list"><tr><td colspan="8" style="text-align:center;color:var(--muted)">読み込み中…</td></tr></tbody></table><div id="deleted-projects-panel" style="display:none;margin-top:28px"><h2 style="font-size:16px;margin:0 0 12px">削除済み案件</h2><table class="table"><thead><tr><th>案件番号</th><th>案件名</th><th>住所</th><th>電話番号</th><th>削除日時</th><th>操作</th></tr></thead><tbody id="deleted-project-list"><tr><td colspan="6" style="text-align:center;color:var(--muted)">読み込み中…</td></tr></tbody></table></div></div></main></div></div><script>const form=document.querySelector('#project-form'),message=document.querySelector('#message'),projectList=document.querySelector('#project-list'),formPanel=document.querySelector('#project-form-panel'),locationInput=document.querySelector('#location-input'),dealersList=document.querySelector('#dealers-list');let projectEditId=null;function normalizeProjectNumber(value){return String(value||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^0-9]/g,"")}function normalizePhoneInput(value){return String(value||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^0-9]/g,"")}form.phone.addEventListener("blur",()=>{form.phone.value=normalizePhoneInput(form.phone.value)});function openProjectForm(){projectEditId=null;form.reset();locationInput.value='';message.textContent='';message.className='';document.querySelector('#project-form-title').textContent='新規案件登録';form.querySelector('#project-submit').textContent='登録する';formPanel.style.display='block'}function closeProjectForm(){projectEditId=null;form.reset();locationInput.value='';message.textContent='';message.className='';document.querySelector('#project-form-title').textContent='新規案件登録';form.querySelector('#project-submit').textContent='登録する';formPanel.style.display='none'}async function openProjectEdit(id){projectEditId=id;message.textContent='';message.className='';document.querySelector('#project-form-title').textContent='案件編集';form.querySelector('#project-submit').textContent='更新する';formPanel.style.display='block';try{const res=await fetch('/api/projects/'+id);if(!res.ok)throw new Error('案件情報を読み込めませんでした。');const detail=await res.json();const p=detail.project;form.project_number.value=p.project_number;form.name.value=p.name;form.kana.value=p.kana;form.address.value=p.address||'';
form.phone.value=p.phone||'';form.email.value=p.email||'';form.dealer.value=p.dealer||'';await loadAssigneesForDealer(p.dealer||'',p.assignee||'');locationInput.value=p.plus_code?p.plus_code:(p.latitude!==null&&p.longitude!==null?p.latitude+', '+p.longitude:'')}catch(err){message.className='error';message.textContent=err.message}}async function deleteProject(id){if(!confirm('この案件を削除しますか？'))return;try{const res=await fetch('/api/projects/'+id,{method:'DELETE'});if(!res.ok)throw new Error(await res.text());location.reload()}catch(err){alert(err.message||'案件の削除に失敗しました。')}}async function restoreProject(id){if(!confirm('この案件を復元しますか？'))return;try{const res=await fetch('/api/projects/'+id+'/restore',{method:'POST'});if(!res.ok)throw new Error(await res.text());location.reload()}catch(err){alert(err.message||'案件の復元に失敗しました。')}}async function loadDeletedProjects(){const panel=document.querySelector('#deleted-projects-panel'),list=document.querySelector('#deleted-project-list');panel.style.display='block';list.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted)">読み込み中…</td></tr>';try{const res=await fetch('/api/deleted/projects', { cache: 'no-store' });if(!res.ok)throw new Error(await res.text());const projects=await res.json();list.innerHTML=projects.length?projects.map(p=>`<tr><td><strong>${esc(p.project_number)}</strong></td><td><strong>${esc(p.name)}</strong><span class="project-kana">${esc(p.kana||"")}</span></td><td><div style="display:flex;gap:4px;flex-direction:column;align-items:flex-start"><span class="badge">書類: ${p.documents_count||0}</span><span class="badge photo-badge">写真: ${p.pictures_count||0}</span></div></td><td>${projectAddressLabel(p)}</td><td>${esc(p.phone||'未登録')}</td><td>${esc(p.deleted_at)}</td><td><button class="btn-sm" onclick="restoreProject(${p.id})">復元</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted)">削除済み案件はありません。</td></tr>'}catch(err){list.innerHTML='<tr><td colspan="6" style=" async function loadAssigneesForDealer(dealerName, selectedAssignee) {
    const assigneeInput = document.getElementById('form-assignee');
    const assigneesList = document.getElementById('assignees-list');
    assigneesList.innerHTML = '';
    assigneeInput.value = selectedAssignee || '';
    if (!dealerName) return;
    try {
        const res = await fetch('/api/dealers/' + encodeURIComponent(dealerName) + '/contacts');
        if (res.ok) {
            const contacts = await res.json();
            contacts.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                assigneesList.appendChild(opt);
            });
        }
    } catch {}
}
