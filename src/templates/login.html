<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ログイン | FileManager3</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:#182230;background:#f6f8fb;--blue:#3977e8;--muted:#758195;--line:#e7ebf2;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f8fb}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:32px;box-shadow:0 10px 30px #1b335014}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-size:18px;font-weight:750}.mark{width:38px;height:38px;border-radius:8px;background:#3977e8;color:#fff;display:grid;place-items:center;font-size:20px}h1{font-size:22px;margin:0 0 6px}.lead{font-size:13px;color:var(--muted);margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;color:#59677b;margin:16px 0 6px}input{width:100%;height:44px;border:1px solid #dbe2ec;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;background:#fbfcfe;outline:0}input:focus{border-color:#5b90ed;box-shadow:0 0 0 3px #3977e81a}button{width:100%;height:44px;margin-top:22px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer}button:hover{background:#2c65d0}button:disabled{background:#9bbcf5;cursor:wait}button.secondary{background:#fff;color:var(--blue);border:1px solid #9bbcf5;margin-top:10px}button.secondary:hover{background:#f8faff}.passkey-note{display:block;text-align:center;margin-top:14px;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;background:none;border:0;padding:0;width:100%;height:auto}.error{min-height:18px;color:var(--danger);font-size:13px;margin:14px 0 0}.access-info{margin:24px 0 0;padding:10px 14px;border:1px solid #b4d3fb;border-radius:8px;background:#eef5ff;font-size:13px;color:#1d4ed8;line-height:1.3;text-align:center}.access-info strong{display:block;color:#1e40af;margin-bottom:4px}.access-info span{display:block;color:#1d4ed8;font-weight:700;word-break:break-all;margin-top:4px}@media(max-width:520px){.page{padding:16px}.panel{padding:24px}}@supports (padding: max(0px)){.page{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root {
  font-family: 'Inter', 'Noto Sans JP', sans-serif !important;

  background: #f8fafc;

}
body { background: #f8fafc; -webkit-font-smoothing: antialiased; }

}

/* ui-consistency */:root{--ui-radius:8px;--ui-control-height:38px}body{-webkit-font-smoothing:antialiased}.card,.panel,.form-panel{border-radius:var(--ui-radius);box-shadow:0 8px 24px rgba(18,35,61,.08)}.topbar{background:#fff;backdrop-filter:none}.btn,button{min-height:var(--ui-control-height);border-radius:var(--ui-radius);box-shadow:none;transform:none;transition:background-color .15s ease,border-color .15s ease,color .15s ease}.btn:hover,button:hover{transform:none;box-shadow:none}.btn-sm{min-height:32px;border-radius:6px}input,select,textarea{border-radius:var(--ui-radius)}.table th,.table td{padding:12px 14px}.dialog-backdrop,.modal-backdrop{background:rgba(18,35,61,.36)}@media(max-width:560px){input,select,textarea{font-size:16px;min-height:44px}.btn,.btn-sm,button{min-height:44px}.content{padding:24px 16px}}</style></head><body><main class="page"><section class="panel"><div class="brand"><div class="mark">⌂</div><span>FileManager<span style="color:#3977e8">3</span><small style="display:block;font-size:10px;color:#64748b;margin-top:3px;font-weight:500">v20260915.00</small></span></div><h1>ログイン</h1><p class="lead">ユーザー名とパスワードを入力してください。</p><form id="login-form"><label for="username">ユーザー名</label><input id="username" name="username" autocomplete="username webauthn" required autofocus><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="login-button">ログイン</button><button id="passkey-login" class="secondary" type="button">パスキーでログイン</button><p id="passkey-hint" class="lead" style="display:none;margin:10px 0 0"></p><p id="message" class="error" aria-live="polite"></p><div id="access-info" class="access-info"><strong>📱 LAN・スマホ接続用アドレス</strong><br><span id="access-info-text">確認中…</span></div></form></section></main><script>if(location.hostname==='127.0.0.1')location.replace(location.href.replace('127.0.0.1','localhost'));const form=document.querySelector('#login-form'),button=document.querySelector('#login-button'),message=document.querySelector('#message'),passkeyLogin=document.querySelector('#passkey-login'),passkeyHint=document.querySelector('#passkey-hint');function passkeyDomainAvailable(){const hostname=location.hostname;return hostname==='localhost'||(hostname.includes('.')&&!/^[\d.:]+$/.test(hostname))}async function setupLocalUsernameSelect(){if(!["localhost","127.0.0.1","[::1]"].includes(location.hostname))return;try{const res=await fetch("/api/login-usernames",{cache:"no-store"});if(!res.ok)return;const users=await res.json();if(!users.length)return;const current=form.username.value;const input=document.createElement("input");input.id="username";input.name="username";input.setAttribute("list","local-usernames");input.autocomplete="username webauthn";input.required=true;const list=document.createElement("datalist");list.id="local-usernames";users.forEach(username=>{const option=document.createElement("option");option.value=username;list.append(option)});input.value=current||users[0];form.username.replaceWith(input);input.insertAdjacentElement("afterend",list);input.addEventListener("input",()=>{lastAutoPasskeyUsername="";clearTimeout(autoPasskeyTimer);autoPasskeyTimer=setTimeout(autoPasskeyLogin,700)});input.addEventListener("change",autoPasskeyLogin);input.focus()}catch(_){} }function b64uToBuf(v){v=v.replace(/-/g,'+').replace(/_/g,'/');v+='='.repeat((4-v.length%4)%4);return Uint8Array.from(atob(v),c=>c.charCodeAt(0)).buffer}function bufToB64u(buf){const bytes=new Uint8Array(buf);let binary="";for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replaceAll("+","-").replaceAll("/","_").replace(/=+$/g,"")}function createOptions(r){const pk=r.public_key.publicKey;pk.challenge=b64uToBuf(pk.challenge);pk.user.id=b64uToBuf(pk.user.id);if(pk.excludeCredentials)pk.excludeCredentials=pk.excludeCredentials.map(c=>({...c,id:b64uToBuf(c.id)}));return{publicKey:pk}}function getOptions(r,conditional){const pk=r.public_key.publicKey;pk.challenge=b64uToBuf(pk.challenge);if(pk.allowCredentials)pk.allowCredentials=pk.allowCredentials.map(c=>({...c,id:b64uToBuf(c.id)}));const options={publicKey:pk};if(conditional)options.mediation="conditional";return options}function regCredential(c){return{id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{attestationObject:bufToB64u(c.response.attestationObject),clientDataJSON:bufToB64u(c.response.clientDataJSON),transports:c.response.getTransports?c.response.getTransports():[]},extensions:c.getClientExtensionResults?c.getClientExtensionResults():{}}}function authCredential(c){return{id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{authenticatorData:bufToB64u(c.response.authenticatorData),clientDataJSON:bufToB64u(c.response.clientDataJSON),signature:bufToB64u(c.response.signature),userHandle:c.response.userHandle?bufToB64u(c.response.userHandle):null},extensions:c.getClientExtensionResults?c.getClientExtensionResults():{}}}async function passkeyRequest(url,payload){const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error(await res.text());return res}const lastUsernameKey="fm3_last_username";function saveLastUsername(username){try{localStorage.setItem(lastUsernameKey,username)}catch(_){}}function restoreLastUsername(){try{const username=localStorage.getItem(lastUsernameKey);if(username&&!form.username.value){form.username.value=username;passkeyHint.style.display="block";passkeyHint.textContent=username+" でパスキー認証できます。";passkeyLogin.textContent="パスキーで続行";passkeyLogin.focus();setTimeout(autoPasskeyLogin,350)}}catch(_){}}let autoPasskeyTimer=null,lastAutoPasskeyUsername="",autoPasskeyInProgress=false;async function startPasskeyLogin(auto){message.textContent="";if(!passkeyDomainAvailable()){if(!auto)message.textContent="パスキーはIPアドレスでは使用できません。mbpm5.localなどのホスト名でアクセスしてください。";return}if(!window.PublicKeyCredential){if(!auto)message.textContent="このブラウザはパスキーに対応していません。";return}const username=form.username.value.trim();if(!username){if(!auto)message.textContent="ユーザー名を入力してください。";return}passkeyLogin.disabled=true;autoPasskeyInProgress=true;try{if(auto)message.textContent="パスキー認証を開始します。";const start=await (await passkeyRequest("/api/passkeys/login/start",{username})).json();let conditional=false;if(auto&&window.PublicKeyCredential&&PublicKeyCredential.isConditionalMediationAvailable){try{conditional=await PublicKeyCredential.isConditionalMediationAvailable()}catch(_){}}const credential=await navigator.credentials.get(getOptions(start,conditional));await passkeyRequest("/api/passkeys/login/finish",{challenge_id:start.challenge_id,credential:authCredential(credential)});saveLastUsername(username);location.href="/"}catch(error){if(!auto)message.textContent=error.message||"パスキーログインに失敗しました。";else message.textContent="パスキーで続行を押してください。"}finally{passkeyLogin.disabled=false;autoPasskeyInProgress=false}}async function autoPasskeyLogin(){const username=form.username.value.trim();if(!passkeyDomainAvailable())return;if(!username||autoPasskeyInProgress||username===lastAutoPasskeyUsername)return;lastAutoPasskeyUsername=username;if(!window.PublicKeyCredential)return;try{await startPasskeyLogin(true)}catch(_){}form.username.addEventListener("input",()=>{lastAutoPasskeyUsername="";clearTimeout(autoPasskeyTimer);autoPasskeyTimer=setTimeout(autoPasskeyLogin,700)});form.username.addEventListener("change",autoPasskeyLogin);passkeyLogin.addEventListener("click",()=>startPasskeyLogin(false));form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';button.disabled=true;try{const data=Object.fromEntries(new FormData(form));const res=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!res.ok)throw new Error('ユーザー名またはパスワードが違います。');saveLastUsername(data.username.trim());location.href='/'}catch(error){message.textContent=error.message||'ログインできませんでした。'}finally{button.disabled=false}});restoreLastUsername();setupLocalUsernameSelect();async function loadAccessInfo(){const box=document.querySelector("#access-info");if(!box)return;try{const d=await (await fetch("/api/access-urls")).json();if(d&&d.lan_url){let html="<div><strong>📱 LAN・モバイル用アドレス</strong> "+d.lan_url+"</div>";const hUrl=d.urls?d.urls.find(u=>u!==d.local_url&&u!==d.lan_url):null;if(hUrl)html+="<div style='margin-top:6px'><strong>🌐 ホスト名での接続</strong> "+hUrl+"</div>";box.innerHTML=html}else{box.textContent='LAN公開起動時に表示されます。'}}catch(_){box.textContent="取得できませんでした。"}}loadAccessInfo();</script></body></html>
