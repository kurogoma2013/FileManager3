:root {
  font-family: 'Inter', 'Noto Sans JP', sans-serif !important;
  color: #0f172a;
  background: #f8fafc;
  --navy: #0f172a;
  --blue: #2563eb;

}
body { background: #f8fafc; -webkit-font-smoothing: antialiased; }
@media (max-width: 560px) {
  input, select, textarea { font-size: 16px !important; min-height: 44px; }

.card, .panel, .form-panel {
  background: #ffffff;
  border: 1px solid rgba(226, 232, 240, 0.8) !important;
  border-radius: 16px !important;

}
.topbar {
  background: rgba(255, 255, 255, 0.85) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.6) !important;
}
.btn {
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
  box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2), 0 2px 4px -2px rgba(37, 99, 235, 0.1) !important;
  border-radius: 10px !important;
}
.btn:hover {
  background: #1d4ed8 !important;
  transform: translateY(-2px);
  box-shadow: 0 6px 10px -1px rgba(37, 99, 235, 0.3), 0 2px 4px -2px rgba(37, 99, 235, 0.1) !important;
}
.btn.secondary {
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
}
.btn.secondary:hover {
  border-color: #cbd5e1 !important; background: #f8fafc !important; color: var(--blue) !important;
  transform: translateY(-2px);
}
.btn-sm {
  transition: all 0.2s ease !important; border-radius: 8px !important;
}
.btn-sm:hover:not(:disabled) {
  transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
.table th, .table td { padding: 16px !important; }

.menu, .icon-btn, .photo-menu-btn, .top-logout, .edit-btn {
  transition: all 0.2s ease !important;
}
.top-logout:hover, .icon-btn:hover, .photo-menu-btn:hover, .edit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05) !important;
}

function updateViewerUi(){if(currentUserRole!=="admin")document.querySelectorAll("[data-note-deleted]").forEach(function(el){el.remove()});if(currentUserRole!=="viewer")return;document.querySelectorAll("[data-admin-only-control],.edit-btn,[data-document-move],[data-photo-delete],[data-selected-action=\"move\"][data-move-tab=\"documents\"],[data-selected-action=\"delete\"],[data-note-deleted],[data-note-delete]").forEach(function(el){el.remove()})}function show(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const panel=document.querySelector('#panel');if(tab==='overview')panel.innerHTML=`<div class="detail-section"><div class="panel-head"><div><h2>案件情報</h2></div><a class="edit-btn" data-admin-only-control href="/admin/projects?edit=${id}">✏ 編集</a></div><div class="detail-card"><div class="detail-item"><label>案件番号</label><strong>${esc(detail.project.project_number)}</strong></div><div class="detail-item"><label>案件名</label><strong>${esc(detail.project.name)}</strong><span class="project-kana">${esc(detail.project.kana||"")}</span></div><div class="detail-item"><label>電話番号</label><strong>${esc(detail.project.phone||"未登録")}</strong></div><div class="detail-item"><label>メールアドレス</label><strong>${esc(detail.project.email||"未登録")}</strong></div><div class="detail-item detail-location"><div><span class="panel-sub">住所</span><strong style="display:block;margin-top:4px">${addressLabel(detail.project.address)}</strong></div><div style="margin-top:10px"><span class="panel-sub">位置情報</span><strong style="display:block;margin-top:4px">${locationLabel(detail.project)}</strong></div></div></div></div><div class="detail-section" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)"><div class="panel-head"><div><h2>販売店情報</h2></div></div><div class="detail-card"><div class="detail-item"><label>販売店</label><strong>${esc(detail.project.dealer||'未登録')}</strong></div><div class="detail-item"><label>担当者</labe function imagePreviewCardHtml(f,menuLabel){const name=fileName(f.file_path);return `<article class="photo-card"><input class="file-select" type="checkbox" data-file-id="${f.id}"><button class="photo-menu-btn" type="button" data-photo-menu="${f.id}" aria-label="${menuLabel}" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button><div class="photo-menu" data-photo-menu-panel="${f.id}"><a href="/api/files/${f.id}/download" download>ダウンロード</a><button type="button" data-photo-print="${f.id}">印刷</button>${historyAction(f)}<button class="danger" type="button" data-photo-delete="${f.id}">削除</button></div><div class="photo-thumb-container" data-document-image-preview="${f.id}" data-photo-name="${esc(name)}" onclick="openDocumentImagePreview(${f.id})"><img class="photo-thumb" data-document-image-preview="${f.id}" data-photo-name="${esc(name)}" src="/api/files/${f.id}/thumbnail" alt="${esc(name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-placeholder',textContent:'▧'}))"></div><div class="photo-info"><span class="file-name">${esc(name)}</span><div class="photo-meta"><span>${formatSize(f.file_size||0)}</span></div></div></article>`}

function fileListHtml(tab,files,icon){if(!files.length)return '<p class="no-file">登録されているファイルはありません。</p>';const dotsSvg='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>';if(tab==='pictures')return '<div class="photo-grid">'+files.map(f=>{const tag=(f.tag||'').trim(),name=fileName(f.file_path);return `<article class="photo-card" data-tag="${esc(tag)}"><input class="file-select" type="checkbox" data-file-id="${f.id}" data-file-tag="${esc(tag)}"><button class="photo-menu-btn" type="button" data-photo-menu="${f.id}" aria-label="写真操作" aria-expanded="false">${dotsSvg}</button><div class="photo-menu" data-photo-menu-panel="${f.id}"><button type="button" data-tag-edit="${f.id}" data-current-tag="${esc(tag)}">移動</button><a href="/api/files/${f.id}/download" download>ダウンロード</a><button type="button" data-photo-print="${f.id}">印刷</button>${historyAction(f)}<button class="danger" type="button" data-photo-delete="${f.id}">削除</button></div>${isVideoFile(f.file_path)?`<div class="photo-thumb-container"><video class="photo-thumb video-thumb" data-photo-preview="${f.id}" controls preload="metadata" src="/api/files/${f.id}/open" aria-label="${esc(name)}"></video></div>`:`<div class="photo-thumb-container" data-photo-preview="${f.id}" data-photo-name="${esc(name)}"><img class="photo-thumb" data-photo-preview="${f.id}" data-photo-name="${esc(name)}" src="/api/files/${f.id}/thumbnail" alt="${esc(name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-placeholder',textContent:'▧'}))"></div>`}<div class="photo-info"><span class="file-name">${esc(name)}</span><div class="photo-meta"><span>${formatSize(f.file_size||0)}</span>${tag?`<span class="photo-tag">${esc(tag)}</span>`:''}</div></div></article>`}).join('')+'</div>';return files.map(f=>tab==='documents'&&isImageFilePath(f.file_path)?imagePreviewCardHtml(f,"書類操作"):`<div class function clearUploadPreviewUrls(){if(previewObjectUrls.length){previewObjectUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(_){}});previewObjectUrls=[]}}function setUploadImagePreview(img,file,wrap){try{const url=URL.createObjectURL(file);previewObjectUrls.push(url);img.src=url;img.onerror=function(){img.replaceWith(Object.assign(document.createElement("span"),{className:"photo-placeholder",textContent:"▧"}))};wrap.appendChild(img)}catch(_){wrap.appendChild(Object.assign(document.createElement("span"),{className:"photo-placeholder",textContent:"▧"}))}}function uploadFilePreview(file,idx,preview,summaryEl){const card=document.createElement("div");card.className="photo-card upload-preview-card";const delBtn=document.createElement("button");delBtn.type="button";delBtn.className="upload-remove-btn";delBtn.textContent="×";delBtn.title="このファイルを除外";delBtn.onclick=e=>{e.stopPropagation();uploadSelectedFiles.splice(idx,1);renderUploadPreviews(preview,summaryEl)};card.appendChild(delBtn);const thumbWrap=document.createElement("div");thumbWrap.className="photo-thumb-container";if(isImageFile(file)){const img=document.createElement("img");img.className="photo-thumb";img.alt=file.name;setUploadImagePreview(img,file,thumbWrap)}else if(isVideoBlob(file)){const video=document.createElement("video");video.className="photo-thumb video-thumb";video.controls=true;video.preload="metadata";const url=URL.createObjectURL(file);previewObjectUrls.push(url);video.src=url;thumbWrap.appendChild(video)}else{const icon=document.createElement("span");icon.className="photo-placeholder";icon.textContent="▤";thumbWrap.appendChild(icon)}card.appendChild(thumbWrap);const info=document.createElement("div");info.className="photo-info";const name=document.createElement("span");name.className="file-name";name.textContent=file.name;const meta=document.createElement("div");meta.className="photo-meta";meta.innerHTML=`<span>${formatSize(file.size)}</span>`;info.appendChild(name);info.appendChild(meta);card.appendChild(info);return card}
function addUploadFiles(newFiles,preview,summaryEl){const incoming=Array.from(newFiles||[]);if(!incoming.length)return;incoming.forEach(f=>{const exists=uploadSelectedFiles.some(cur=>cur.name===f.name&&cur.size===f.size&&cur.lastModified===f.lastModified);if(!exists)uploadSelectedFiles.push(f)});renderUploadPreviews(preview,summaryEl)}
function clearUploadFiles(preview,summaryEl){uploadSelectedFiles=[];const inp=document.querySelector("#upload-input");if(inp)inp.value="";renderUploadPreviews(preview,summaryEl)}
function renderUploadPreviews(preview,summaryEl){preview.innerHTML="";clearUploadPreviewUrls();if(!uploadSelectedFiles.length){if(summaryEl)summaryEl.innerHTML="";return}const totalBytes=uploadSelectedFiles.reduce((acc,f)=>acc+(f.size||0),0);if(summaryEl){summaryEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;background:#edf3ff;color:var(--navy);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:12px;font-weight:700;"><span>選択中: ${uploadSelectedFiles.length} 件 (${formatSize(totalBytes)})</span><button type="button" class="btn-sm" style="padding:2px 8px;" id="upload-clear-btn">選択解除</button></div>`;const clearBtn=summaryEl.querySelector("#upload-clear-btn");if(clearBtn)clearBtn.onclick=()=>clearUploadFiles(preview,summaryEl)}const frag=document.createDocumentFragment();uploadSelectedFiles.forEach((file,idx)=>frag.appendChild(uploadFilePreview(file,idx,preview,summaryEl)));preview.appendChild(frag)}
function setUploadStatus(text,kind){let status=document.querySelector("#upload-status");if(!status){status=document.createElement("div");status.id="upload-status";document.body.appendChild(status)}status.className="upload-status"+(kind?" "+kind:"");status.textContent=text;return status}
async function uploadFilesInBackground(tab,files,tag){const total=files.length;let completed=0,skipped=0,failed=0;const errors=[];setUploadStatus("アップロード中… 0/"+total+"件");await Promise.all(files.map(async file=>{try{const body=new FormData();body.append("file",file);if(tag)body.append("tag",tag);const res=await fetch("/api/projects/"+id+"/files?category="+encodeURIComponent(tab),{method:"POST",body});if(res.status===401){location.href="/";return}if(res.status===200){skipped++;return}if(!res.ok)throw new Error(await res.text());completed++}catch(err){failed++;errors.push(file.name+": "+(err.message||"アップロードに失敗しました。"))}finally{const processed=completed+skipped+failed;setUploadStatus("アップロード中… "+processed+"/"+total+"件")}}));await load();const summary="新規 "+completed+"件、スキップ "+skipped+"件、失敗 "+failed+"件";const status=setUploadStatus(summary+(errors.length?"（"+errors[0]+"）":""),failed?"error":"success");setTimeout(()=>{if(status.parentNode)status.remove()},5000)}
