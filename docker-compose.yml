services:
  filemanager3-postgres:
    image: postgres:18
    container_name: filemanager3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: filemanager3
      POSTGRES_USER: filemanager3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - filemanager3-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager3 -d filemanager3"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  filemanager3-postgres-data:
